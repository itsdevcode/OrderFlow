[tool.basedpyright]
reportImportCycles = false

[tool.pyright]
venvPath = "."
venv = "venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# SQLAlchemy async sessions switch through greenlets; track those contexts as
# well as FastAPI's threads so executed async service paths are measured.
concurrency = ["greenlet", "thread"]
